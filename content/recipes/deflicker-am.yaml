id: deflicker-am
title:
  zh: 整幅 deflicker
  en: Whole-frame deflicker
requires:
  - ffmpeg
minVersion: '6.1'
diagnose: ffmpeg -hide_banner -i input.mov -vf signalstats,metadata=print -an -f null -
fix: ffmpeg -i input.mov -vf deflicker=size=9:mode=am -c:a copy output.mov
avoid: |-
  This normalizes one gain per frame. Rolling-shutter bands stay. A long window also tracks real lighting changes.
  这是每帧一个增益。滚动快门横条还在。窗口太长会跟上真正的灯光变化。
samples:
  - id: flicker-global
    zh: 墙上一个人，整幅 4 Hz 起伏。
    en: A person on a wall, whole-frame 4 Hz.
    command: ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'color=c=0x8e8474:s=480x270:r=25:d=0.64,format=yuv444p,geq=lum='\''clip((90+if(lt(pow(X-240\,2)+pow(Y-90\,2)\,1400)\,70\,0)+if(between(X\,214\,266)*between(Y\,120\,230)\,55\,0)+if(between(X\,40\,150)*between(Y\,30\,150)\,30\,0))*(0.55+0.45*sin(2*PI*4*T))\,16\,235)'\'':cb=128:cr=128' -start_number 0 -frames:v 12 media/generated/flicker-global/frame-%02d.png
  - id: flicker-global-deflicker
    zh: 同一起伏经过 deflicker。
    en: That swing after deflicker.
    command: ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'color=c=gray:s=480x270:r=25:d=0.64,format=yuv444p,geq=lum='\''clip(70+90*sin(2*PI*4*T)\,16\,235)'\'':cb=128:cr=128,deflicker=size=9:mode=am' -start_number 0 -frames:v 12 media/generated/flicker-global-deflicker/frame-%02d.png
  - id: flicker-bands
    zh: 同一个人，横条按行错开。
    en: The same person, with per-row bands.
    command: ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'color=c=0x8e8474:s=480x270:r=25:d=0.64,format=yuv444p,geq=lum='\''clip((90+if(lt(pow(X-240\,2)+pow(Y-90\,2)\,1400)\,70\,0)+if(between(X\,214\,266)*between(Y\,120\,230)\,55\,0)+if(between(X\,40\,150)*between(Y\,30\,150)\,30\,0))*(0.55+0.45*sin(2*PI*(4*T+Y/48)))\,16\,235)'\'':cb=128:cr=128' -start_number 0 -frames:v 8 media/generated/flicker-bands/frame-%02d.png
  - id: flicker-bands-deflicker
    zh: 横条经过 deflicker，带还在。
    en: Bands after deflicker. The bands remain.
    command: ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'color=c=gray:s=480x270:r=25:d=0.64,format=yuv444p,geq=lum='\''clip(70+90*sin(2*PI*(4*T+Y/48))\,16\,235)'\'':cb=128:cr=128,deflicker=size=9:mode=am' -start_number 0 -frames:v 8 media/generated/flicker-bands-deflicker/frame-%02d.png
